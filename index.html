<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed Kaseb Quran</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed painted scene behind a centered surah title; glass control deck pinned to the bottom; surah list slides over as a full-screen sheet. */
:root {
  --night: #07101f;
  --ink: #f6efe0;
  --ink-dim: rgba(246, 239, 224, .66);
  --gold: #e3b866;
  --glass: rgba(7, 14, 30, .58);
  --line: rgba(246, 239, 224, .16);
  --display: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --body: "DM Sans", "Tajawal", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 8px; }

.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--night); }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 3s ease; }
.layer.on { opacity: 1; }
.scrim {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(4, 8, 18, .55) 0%, rgba(4, 8, 18, 0) 28%, rgba(4, 8, 18, 0) 48%, rgba(4, 8, 18, .78) 100%);
}

.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; max-width: 560px; margin-inline: auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: .01em; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
.pill {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-weight: 500;
}
.pill svg { width: 20px; height: 20px; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding-block: 8px; }
.eyebrow { color: var(--gold); font-size: 15px; letter-spacing: .2em; display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
.eyebrow svg { width: 18px; height: 18px; }
.name {
  margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.15;
  font-size: clamp(56px, 19vw, 118px); text-wrap: balance;
  text-shadow: 0 2px 28px rgba(0,0,0,.55);
}
.name.long { font-size: clamp(28px, 8.5vw, 46px); line-height: 1.5; }
.sub { color: var(--ink); opacity: .92; font-size: 17px; text-shadow: 0 1px 12px rgba(0,0,0,.7); }
.mushaf-no { color: var(--ink-dim); font-size: 14px; text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.msg {
  margin-top: 10px; padding: 10px 14px; border-radius: 14px; max-width: 92%;
  background: rgba(60, 14, 14, .78); border: 1px solid rgba(255, 150, 130, .4); font-size: 14px; line-height: 1.7;
}
.msg a { color: var(--gold); font-weight: 700; }

.deck {
  display: flex; flex-direction: column; gap: 14px;
  padding: 16px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  margin-inline: -16px; margin-bottom: 0;
  background: var(--glass); border-top: 1px solid var(--line);
  border-radius: 28px 28px 0 0;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.seek { display: flex; align-items: center; gap: 12px; }
.time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-dim); min-width: 44px; text-align: center; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 28px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(to left, var(--gold) var(--p, 0%), rgba(246,239,224,.22) var(--p, 0%)); }
input[type=range]::-moz-range-track { height: 5px; border-radius: 5px; background: rgba(246,239,224,.22); }
input[type=range]::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--gold); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); margin-top: -6.5px; box-shadow: 0 0 0 4px rgba(227,184,102,.28); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px rgba(227,184,102,.28); }

.main { display: flex; align-items: center; justify-content: center; gap: 30px; }
.tabs { display: flex; gap: 8px; margin-bottom: 10px; }
.tabs .chip { flex: 1; }
.ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
.ic svg { width: 26px; height: 26px; fill: currentColor; }
.ic:active { background: rgba(246,239,224,.12); }
.skip { font-size: 13px; font-weight: 700; color: var(--ink-dim); width: 52px; height: 48px; border-radius: 14px; }
.skip:active { background: rgba(246,239,224,.12); }
.play { width: 72px; height: 72px; border-radius: 50%; background: var(--gold); color: #1a1206; display: grid; place-items: center; box-shadow: 0 8px 28px rgba(227,184,102,.35); }
.play svg { width: 34px; height: 34px; fill: currentColor; }
.play.busy svg { display: none; }
.play.busy::after { content: ""; width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(26,18,6,.25); border-top-color: #1a1206; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.extras { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--ink-dim); }
.chip[aria-pressed=true], .chip.act { color: var(--gold); border-color: rgba(227,184,102,.55); }

.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--night);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column;
}
.sheet-in { width: 100%; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; min-height: 0; height: 100%; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 10px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 26px; }
.search { width: 100%; min-height: 46px; border-radius: 14px; border: 1px solid var(--line); background: rgba(246,239,224,.06); color: var(--ink); padding: 0 16px; font: inherit; margin-bottom: 8px; }
.search::placeholder { color: var(--ink-dim); }
.list { list-style: none; margin: 0; padding: 0 0 24px; overflow-y: auto; min-height: 0; flex: 1; }
.item { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.item .row { border-bottom: 0; flex: 1; min-width: 0; }
.dl { width: 48px; height: 48px; flex: none; display: grid; place-items: center; color: var(--ink-dim); border-radius: 50%; }
.dl svg { width: 22px; height: 22px; }
.dl.on { color: var(--gold); }
.dl.pct { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--gold); }
.dlmsg { margin: 0 0 8px; padding: 10px 14px; border-radius: 12px; background: rgba(246,239,224,.08); color: var(--ink); font-size: 13.5px; line-height: 1.45; }
.dl:active { background: rgba(246,239,224,.12); color: var(--gold); }
.row { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.row .no { width: 40px; flex: none; text-align: center; font-size: 14px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.row .nm.sm { font-size: 19px; line-height: 1.55; padding-block: 6px; }
.empty.note { padding: 10px 0; font-size: 14px; line-height: 1.7; }
.row .nm { flex: 1; min-width: 0; font-family: var(--display); font-size: 24px; }
.row.cur .nm, .row.cur .no { color: var(--gold); }
.eq { display: none; gap: 3px; align-items: flex-end; height: 18px; }
.row.cur.playing .eq { display: flex; }
.eq i { width: 3px; background: var(--gold); border-radius: 2px; animation: eq 0.9s ease-in-out infinite alternate; height: 100%; }
.eq i:nth-child(2) { animation-delay: .25s; } .eq i:nth-child(3) { animation-delay: .5s; }
@keyframes eq { from { transform: scaleY(.25); transform-origin: bottom; } to { transform: scaleY(1); transform-origin: bottom; } }
.empty { padding: 28px 0; text-align: center; color: var(--ink-dim); }

@media (max-height: 640px) { .name { font-size: clamp(44px, 14vw, 80px); } .play { width: 62px; height: 62px; } }
@media (prefers-reduced-motion: reduce) {
  .layer { transition-duration: .4s; }
  .eq i, .play.busy::after { animation-duration: 2.4s; }
}
.row { text-align: left; }
.row .nm, .row .nm.sm { display: flex; flex-direction: column; align-items: flex-end; text-align: right; font-family: var(--body); font-size: inherit; line-height: 1.3; padding-block: 4px; }
.row .nm .ar { font-family: var(--display); font-size: 24px; line-height: 1.4; }
.row .nm.sm .ar { font-size: 19px; line-height: 1.6; }
.row .nm small { font-size: 12.5px; color: var(--ink-dim); letter-spacing: .02em; }
.row.cur .nm small { color: var(--gold); opacity: .85; }
.eq { margin-inline-end: 4px; }
input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--gold) var(--p, 0%), rgba(246,239,224,.22) var(--p, 0%)); }
.eyebrow { text-transform: uppercase; font-size: 13px; letter-spacing: .24em; }
.sub { letter-spacing: .02em; }
.brand { font-family: var(--body); font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.empty.note { text-align: left; }
</style>

<div class="bg" aria-hidden="true"><canvas class="layer" id="la"></canvas><canvas class="layer" id="lb"></canvas><div class="scrim"></div></div>

<main class="app" id="app" dir="ltr" lang="en">
  <header class="top">
    <div class="brand">Ahmed Kaseb</div>
    <button class="pill" id="openList" type="button" aria-label="Open library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Library
    </button>
  </header>

  <section class="stage" aria-live="polite">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.6 4.4L19.5 4.5l-.9 5L23 12l-4.4 2.6.9 5-4.9-.9L12 23l-2.6-4.3-4.9.9.9-5L1 12l4.4-2.5-.9-5 4.9.9z"/></svg>
      <span id="kind">Surah</span>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.6 4.4L19.5 4.5l-.9 5L23 12l-4.4 2.6.9 5-4.9-.9L12 23l-2.6-4.3-4.9.9.9-5L1 12l4.4-2.5-.9-5 4.9.9z"/></svg>
    </div>
    <h1 class="name" id="name" dir="rtl" lang="ar">الفاتحة</h1>
    <div class="sub" id="sub">Recited by Sheikh Ahmed Kaseb</div>
    <div class="mushaf-no" id="no"></div>
    <div class="msg" id="msg" hidden></div>
  </section>

  <section class="deck" aria-label="Playback controls">
    <div class="seek">
      <span class="time" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <span class="time" id="dur">0:00</span>
    </div>
    <div class="main">
      <button class="ic" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M5 5h2.4v14H5zM20 5v14L8.5 12z"/></svg></button>
      <button class="play" id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
      <button class="ic" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16.6 5H19v14h-2.4zM4 5v14l11.5-7z"/></svg></button>
    </div>
    <div class="extras">
      <button class="chip act" id="mode" type="button">Play in order</button>
      <button class="chip" id="fav" type="button" aria-pressed="false">♡ Save</button>
      <a class="chip" id="src" href="#" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">File link</a>
      <button class="chip" id="scene" type="button">Change scene</button>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" dir="ltr" lang="en" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <h2>Library</h2>
      <button class="pill" id="closeList" type="button">Close</button>
    </div>
    <div class="tabs">
      <button class="chip act" id="tabM" type="button">Mushaf · 114</button>
      <button class="chip" id="tabC" type="button">Recitations</button>
    </div>
    <div class="tabs">
      <button class="chip act" id="tabAll" type="button">All</button>
      <button class="chip" id="tabFav" type="button">Saved</button>
      <button class="chip" id="tabOff" type="button">Offline</button>
    </div>
    <div class="dlmsg" id="dlmsg" hidden></div>
    <input class="search" id="q" type="search" placeholder="Search by name or number" autocomplete="off" aria-label="Search">
    <ul class="list" id="list"></ul>
  </div>
</div>

  var $ = function (id) { return document.getElementById(id); };
  var ar = function (n) { return Number(n).toLocaleString("en-US", { useGrouping: false }); };
  function fileOf(n) { return n === 99 ? "99.mp3" : ("00" + n).slice(-3) + ".mp3"; }

  /* ---------- animated nature wallpapers (canvas, drawn in code, no external images) ---------- */
  var W = 1, H = 1, DPR = 1;
  var R = function (s) { return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; };
  function off(fn) { var c = document.createElement("canvas"); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); var g = c.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0); fn(g); return c; }
  function lin(g, stops, y0, y1) { var o = g.createLinearGradient(0, y0, 0, y1); stops.forEach(function (s) { o.addColorStop(s[0], s[1]); }); return o; }

  var DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>';
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  var OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function dlHtml(t) {
    var id = idOf(t), a = ' data-c="' + t.col + '" data-n="' + t.key + '" data-id="' + id + '"';
    if (bundled[id]) return '<span class="dl on"' + a + ' title="Included in the app" aria-label="Included offline">' + OK + '</span>';
    if (saved[id]) return '<button class="dl on" type="button" data-act="rm"' + a + ' aria-label="Downloaded. Tap to remove">' + OK + '</button>';
    if (id in dls) return '<span class="dl pct"' + a + '>' + (dls[id] >= 0 ? dls[id] + "%" : "…") + '</span>';
    return '<button class="dl" type="button" data-act="dl"' + a + ' aria-label="Download for offline">' + DL + '</button>';
  }
  function paintDl(id) {
    var el = listEl.querySelector('.dl[data-id="' + id + '"]'); if (!el) return;
    var t = track(el.getAttribute("data-c"), +el.getAttribute("data-n")); if (!t) return;
    el.outerHTML = dlHtml(t);
  }
  function dlNote(m) { var d = $("dlmsg"); if (m) { d.textContent = m; d.hidden = false; } else { d.hidden = true; } }
  function downloadNative(t) {
    var id = idOf(t); if (id in dls) return;
    dls[id] = 0; paintDl(id); dlNote("");
    var h = null, last = 0;
    function cleanup() { if (h && h.then) h.then(function (x) { try { x.remove(); } catch (e) {} }); }
    try {
      h = FS.addListener("progress", function (ev) {
        if (!ev || ev.url !== t.url) return;
        var v = ev.contentLength ? Math.min(99, Math.round(ev.bytes / ev.contentLength * 100)) : -1;
        if (v !== last) { last = v; dls[id] = v; paintDl(id); }
      });
    } catch (e) {}
    FS.downloadFile({ url: t.url, path: fsPath(id), directory: "DATA", recursive: true, progress: true }).then(function () {
      saved[id] = 1; delete dls[id]; cleanup(); paintDl(id);
      if (onlyOff) buildList($("q").value);
    }).catch(function (err) {
      delete dls[id]; cleanup(); paintDl(id);
      try { FS.deleteFile({ path: fsPath(id), directory: "DATA" }).catch(function () {}); } catch (e) {}
      dlNote("Download failed" + (err && err.message ? " (" + err.message + ")" : "") + ". Check your internet connection and try again.");
    });
  }
  function download(t) {
    if (FS) return downloadNative(t);
    var id = idOf(t); if (id in dls) return;
    dls[id] = 0; paintDl(id); dlNote("");
    fetch(t.url).then(function (r) {
      if (!r.ok) throw new Error("http");
      var total = +r.headers.get("content-length") || 0;
      if (!r.body || !r.body.getReader) return r.blob();
      var rd = r.body.getReader(), parts = [], got = 0;
      function pump() {
        return rd.read().then(function (x) {
          if (x.done) return new Blob(parts, { type: "audio/mpeg" });
          parts.push(x.value); got += x.value.length;
          dls[id] = total ? Math.min(99, Math.round(got / total * 100)) : -1; paintDl(id);
          return pump();
        });
      }
      return pump();
    }).then(function (b) {
      return dbReq("readwrite", function (st) { return st.put(b, id); });
    }).then(function () {
      saved[id] = 1; delete dls[id]; paintDl(id);
      if (onlyOff) buildList($("q").value);
    }).catch(function () {
      delete dls[id]; paintDl(id);
      dlNote("Download failed. Check your connection and try again. (Downloads work in the installed app or the downloaded HTML file, not inside the preview.)");
    });
  }
  function removeDl(t) {
    var id = idOf(t);
    if (window.confirm && !window.confirm("Remove this download from your device?")) return;
    if (FS) {
      FS.deleteFile({ path: fsPath(id), directory: "DATA" }).catch(function () {}).then(function () {
        delete saved[id]; paintDl(id); if (onlyOff) buildList($("q").value);
      });
      return;
    }
    dbReq("readwrite", function (st) { return st.delete(id); }).then(function () {
      delete saved[id]; paintDl(id); if (onlyOff) buildList($("q").value);
    }).catch(function () {});
  }
  (FS ? FS.readdir({ path: "audio", directory: "DATA" }).then(function (r) {
    return (r.files || []).map(function (f) { return String(f.name || f).replace(/\.mp3$/, ""); });
  }) : dbp.then(function () {
    return dbReq("readonly", function (st) { return st.getAllKeys(); });
  })).then(function (keys) {
    (keys || []).forEach(function (k) { saved[k] = 1; });
    buildList($("q").value);
    if (now && saved[idOf(now)] && audio.paused && !audio.currentTime) setSrc(now, false);
  }).catch(function () {});
  function buildList(filter) {
    var f = norm(filter || ""), html = "", count = 0, note = "";
    all(view).forEach(function (t) {
      if (onlyFav && !isFav(fk(t.col, t.key))) return;
      if (onlyOff && !isOff(t)) return;
      if (f && norm(t.title).indexOf(f) === -1 && lat(t.tr).indexOf(lat(filter)) === -1 && String(t.key) !== f) return;
      count++;
      html += '<li class="item"><button class="row" type="button" data-c="' + t.col + '" data-n="' + t.key + '"><span class="no">' + t.key + '</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="nm' + (t.col === "c" ? " sm" : "") + '"><span class="ar" dir="rtl" lang="ar">' + esc(t.title) + '</span>' + (t.tr ? "<small>" + t.tr + "</small>" : "") + '</span></button>' +
        dlHtml(t) + '</li>';
    });
    if (view === "c" && clipsState === "loading") note = "Loading the full list from the archive…";
    listEl.innerHTML = (note ? '<li class="empty note">' + note + "</li>" : "") + (count ? html : '<li class="empty">' + (onlyOff && !f ? "Nothing available offline here yet. Tap the download arrow on any item." : onlyFav && !f ? "Nothing saved here yet. Tap Save while listening." : "No results") + "</li>");
    markRows();
  }
  function markRows() {
    var playing = !audio.paused && !audio.ended;
    var rows = listEl.querySelectorAll(".row");
    for (var i = 0; i < rows.length; i++) {
      var on = rows[i].getAttribute("data-c") === col && +rows[i].getAttribute("data-n") === cur;
      rows[i].classList.toggle("cur", on); rows[i].classList.toggle("playing", on && playing);
    }
  }
  listEl.addEventListener("click", function (e) {
    var d = e.target.closest(".dl[data-act]");
    if (d) {
      var tt = track(d.getAttribute("data-c"), +d.getAttribute("data-n"));
      if (tt) { if (d.getAttribute("data-act") === "dl") download(tt); else removeDl(tt); }
      return;
    }
    var b = e.target.closest(".row"); if (!b) return;
    select(b.getAttribute("data-c"), +b.getAttribute("data-n"), true); closeSheet();
  });
  $("q").addEventListener("input", function () { buildList(this.value); });
  function openSheet() { $("sheet").hidden = false; $("app").setAttribute("aria-hidden", "true"); var r = listEl.querySelector(".row.cur"); if (r) r.scrollIntoView({ block: "center" }); }
  function closeSheet() { $("sheet").hidden = true; $("app").removeAttribute("aria-hidden"); }
  $("openList").addEventListener("click", openSheet);
  $("closeList").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  paintTabs(); buildList("");
  select(col, cur, false);
  probeBundled();
  setPlayIcon(false);
  if (view === "c" || col === "c") loadClips();
})();
</script>
